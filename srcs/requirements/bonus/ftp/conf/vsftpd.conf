listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES

chroot_local_user=YES
# block user navigation
allow_writeable_chroot=YES
# keep the user in jail even if directory is writable
xferlog_enable=YES
# for logs
log_ftp_protocol=YES
# for specified logs
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
seccomp_sandbox=NO